name: Publish QuickCall data

on:
  push:
    branches: [main]
    paths:
      - quick-call-image/catalog.json
      - quick-call-image/export.py
      - .github/workflows/quick-call-data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-call-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Validate master and publish selected-data packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 quick-call-image/export.py
            git add quick-call-image/index.json quick-call-image/index.txt quick-call-image/packs
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Publish QuickCall data packs'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'The branch changed repeatedly; rerun this workflow.' >&2
          exit 1
